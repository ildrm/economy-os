packages:
  - "apps/*"
  - "packages/*"
  - "services/*"

allowBuilds:
  '@scarf/scarf': false
  '@swc/core': true
  protobufjs: false

catalogMode: strict
enableGlobalVirtualStore: false
verifyDepsBeforeRun: error

# Keep Nest's internal Fastify copy on the same patched release as the API.
overrides:
  '@nestjs/platform-fastify>fastify': '5.12.1'
